<div class="min-h-screen p-4 md:p-8 space-y-8 animate-fade-in">
  <!-- Profile Form Main Card -->
  <div class="glass-panel p-6 md:p-10 rounded-3xl border border-white/10 shadow-2xl space-y-8">
    <!-- Profile Avatar Header -->
    <div class="flex flex-col items-center text-center space-y-4 border-b border-white/10 pb-6">
      <div class="relative group">
        <img class="w-28 h-28 md:w-36 md:h-36 rounded-full object-cover border-2 border-indigo-500/50 shadow-xl shadow-indigo-500/20" [src]="profileImage" alt="User Avatar">
        <label for="profileImageInput" class="absolute inset-0 rounded-full bg-gray-950/60 backdrop-blur-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all cursor-pointer text-xs font-bold text-white">
          <mat-icon fontIcon="photo_camera" class="mr-1 text-sm"></mat-icon> Change
        </label>
        <input type="file" id="profileImageInput" accept="image/*" (change)="onProfileImageSelected($event)" class="hidden">
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-white">User Profile Settings</h2>
        <p class="text-xs text-gray-400">Update your personal details, contact preferences, and credentials</p>
      </div>
    </div>

    <!-- Loaded Form -->
    <form *ngIf="loaded; else loadingProfileSkeleton" [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div>
          <label for="name" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Full Name</label>
          <input type="text" formControlName="name" class="w-full px-4 py-3 glass-input text-sm" placeholder="John Doe">
          <div *ngIf="f['name'].errors && (f['name'].dirty || f['name'].touched)" class="text-rose-400 text-xs mt-1">* Name is required</div>
        </div>

        <div>
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
          <input type="email" formControlName="email" class="w-full px-4 py-3 glass-input text-sm" placeholder="john@company.com">
          <div *ngIf="f['email'].errors && (f['email'].dirty || f['email'].touched)" class="text-rose-400 text-xs mt-1">* Valid email required</div>
        </div>

        <div>
          <label for="gender" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Gender</label>
          <select formControlName="gender" class="w-full px-4 py-3 glass-input text-sm bg-gray-900 text-white">
            <option value="" disabled>Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label for="phoneNumber" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Primary Phone</label>
          <input type="tel" formControlName="phoneNumber" class="w-full px-4 py-3 glass-input text-sm" placeholder="+1 555-0199">
        </div>

        <div>
          <label for="secondPhoneNumber" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Secondary Phone</label>
          <input type="tel" formControlName="secondPhoneNumber" class="w-full px-4 py-3 glass-input text-sm" placeholder="+1 555-0198">
        </div>

        <div>
          <label for="address" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Address</label>
          <input type="text" formControlName="address" class="w-full px-4 py-3 glass-input text-sm" placeholder="City, Country">
        </div>

        <div class="md:col-span-2 lg:col-span-3">
          <label for="bio" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Professional Bio</label>
          <textarea formControlName="bio" rows="3" class="w-full px-4 py-3 glass-input text-sm" placeholder="Short bio description..."></textarea>
        </div>
      </div>

      <div *ngIf="profileFormError" class="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
        <mat-icon class="text-sm">error</mat-icon>
        <span>{{ profileFormError }}</span>
      </div>

      <div class="flex justify-end pt-4 border-t border-white/10">
        <button type="submit" class="glass-button py-3.5 px-8 text-sm">Save Profile Changes</button>
      </div>
    </form>

    <!-- Skeleton Loading Template -->
    <ng-template #loadingProfileSkeleton>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-pulse p-4">
        <div *ngFor="let item of [1, 2, 3, 4, 5, 6]" class="space-y-2">
          <div class="h-3 w-20 bg-white/10 rounded-full"></div>
          <div class="h-12 w-full bg-white/5 rounded-xl border border-white/5"></div>
        </div>
      </div>
    </ng-template>
  </div>

  <!-- Change Password Section Card -->
  <div class="glass-panel p-6 md:p-8 rounded-3xl border border-white/10 shadow-2xl space-y-6">
    <div class="flex items-center gap-3 border-b border-white/10 pb-4">
      <div class="w-9 h-9 rounded-xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-400">
        <mat-icon fontIcon="lock"></mat-icon>
      </div>
      <div>
        <h3 class="text-xl font-bold text-white">Security &amp; Password</h3>
        <p class="text-xs text-gray-400">Update your account password</p>
      </div>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <label for="currentPassword" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Current Password</label>
        <input type="password" formControlName="currentPassword" class="w-full px-4 py-3 glass-input text-sm" placeholder="••••••••••••">
      </div>

      <div>
        <label for="newPassword" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">New Password</label>
        <input type="password" formControlName="newPassword" class="w-full px-4 py-3 glass-input text-sm" placeholder="••••••••••••">
      </div>

      <div>
        <label for="confirmNewPassword" class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Confirm New Password</label>
        <input type="password" formControlName="confirmNewPassword" class="w-full px-4 py-3 glass-input text-sm" placeholder="••••••••••••">
      </div>

      <div *ngIf="passwordErrorMessage" class="md:col-span-3 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
        <mat-icon class="text-sm">error</mat-icon>
        <span>{{ passwordErrorMessage }}</span>
      </div>

      <div class="md:col-span-3 flex justify-end">
        <button type="submit" class="glass-button py-3 px-8 text-sm">Update Password</button>
      </div>
    </form>
  </div>
</div>
