<!-- Desktop Glass Table View -->
<div *ngIf="tableData && tableData.length > 0" class="mx-auto w-full hidden lg:block overflow-hidden rounded-2xl border border-white/10 shadow-xl bg-gray-950/40 animate-fade-in">
  <table class="w-full text-left border-collapse text-sm">
    <thead>
      <tr class="bg-white/[0.04] text-gray-300 font-semibold border-b border-white/10 uppercase tracking-wider text-[11px]">
        <th class="px-5 py-4" *ngFor="let head of tableHead">{{ head }}</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-white/5 text-gray-200">
      <ng-container *ngFor="let data of tableData">
        <tr (click)="onRowClick(data[keyID])" class="hover:bg-white/[0.05] hover:text-white cursor-pointer transition-all duration-200 group">
          <ng-container *ngFor="let head of tableHead">
            <td class="px-5 py-4 font-medium text-xs group-hover:text-indigo-300">
              {{ data[head] }}
            </td>
          </ng-container>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>

<!-- Mobile & Tablet Glass Cards View -->
<div *ngIf="tableData && tableData.length > 0" class="block lg:hidden space-y-3 animate-fade-in">
  <ng-container *ngFor="let data of tableData">
    <div (click)="onRowClick(data[keyID])" class="glass-card glass-card-hover p-4 cursor-pointer space-y-2 border border-white/10">
      <ng-container *ngFor="let head of tableHead">
        <div class="flex items-center justify-between text-xs py-1 border-b border-white/5 last:border-0">
          <span class="font-bold text-gray-400 uppercase tracking-wider text-[10px]">{{ head }}:</span>
          <span class="text-gray-200 font-medium">{{ data[head] }}</span>
        </div>
      </ng-container>
    </div>
  </ng-container>
</div>

<!-- Table Skeleton Loader Before Data Responds -->
<div *ngIf="!tableData || tableData.length === 0" class="w-full space-y-3 p-4 animate-pulse">
  <div class="h-10 w-full bg-white/5 rounded-xl border border-white/5"></div>
  <div class="h-12 w-full bg-indigo-500/10 rounded-xl border border-white/5"></div>
  <div class="h-12 w-full bg-white/5 rounded-xl border border-white/5"></div>
  <div class="h-12 w-full bg-white/5 rounded-xl border border-white/5"></div>
</div>
