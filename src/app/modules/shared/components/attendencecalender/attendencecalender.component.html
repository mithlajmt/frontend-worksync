<div class="min-h-screen p-4 md:p-8 space-y-6 animate-fade-in flex flex-col items-center">
  <!-- Calendar Container Glass Panel -->
  <div class="glass-panel p-6 md:p-8 rounded-3xl border border-white/10 shadow-2xl space-y-6 max-w-4xl w-full">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
          <mat-icon fontIcon="calendar_month"></mat-icon>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-extrabold text-white tracking-tight">Attendance Calendar</h1>
          <p class="text-xs text-gray-400">Monthly check-in records and shift status</p>
        </div>
      </div>

      <!-- Legend Badges -->
      <div class="flex items-center gap-2.5 text-xs font-semibold">
        <span class="glass-badge bg-emerald-500/20 text-emerald-300 border-emerald-500/30 flex items-center gap-1.5 px-3 py-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Present
        </span>
        <span class="glass-badge bg-amber-500/20 text-amber-300 border-amber-500/30 flex items-center gap-1.5 px-3 py-1">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span> Late
        </span>
        <span class="glass-badge bg-rose-500/20 text-rose-300 border-rose-500/30 flex items-center gap-1.5 px-3 py-1">
          <span class="w-2 h-2 rounded-full bg-rose-400"></span> Leave
        </span>
      </div>
    </div>

    <!-- Calendar View Container with White Background for Full Legibility -->
    <div *ngIf="showCalendar; else loadingCalendarSkeleton" class="bg-white p-4 md:p-6 rounded-2xl max-w-3xl mx-auto shadow-2xl border border-gray-200 overflow-hidden">
      <full-calendar [options]="calendarOptions" class="w-full text-xs"></full-calendar>
    </div>

    <!-- Skeleton Loading Fallback -->
    <ng-template #loadingCalendarSkeleton>
      <div class="glass-card p-8 min-h-[360px] max-w-3xl mx-auto flex flex-col items-center justify-center space-y-4 animate-pulse border border-white/5">
        <div class="w-10 h-10 rounded-full border-4 border-indigo-500/30 border-t-indigo-500 animate-spin"></div>
        <div class="h-3 w-36 bg-white/10 rounded-full"></div>
        <div class="h-2 w-24 bg-white/5 rounded-full"></div>
      </div>
    </ng-template>
  </div>
</div>
