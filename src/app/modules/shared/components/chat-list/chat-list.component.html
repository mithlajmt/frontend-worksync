<div class="h-full glass-panel border-r border-white/10 p-4 space-y-4 flex flex-col">
  <!-- Search -->
  <div class="relative">
    <mat-icon class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm">search</mat-icon>
    <input type="text" placeholder="Search contacts..." class="w-full glass-input text-xs pl-10 pr-4 py-2.5 rounded-xl">
  </div>

  <!-- Contacts List -->
  <div class="flex-1 overflow-y-auto space-y-2 pr-1">
    <ng-container *ngIf="contacts && contacts.length > 0; else noContacts">
      <div *ngFor="let user of contacts" (click)="onContactClick(user)" class="glass-card glass-card-hover p-3 flex items-center gap-3 cursor-pointer border border-white/5 rounded-2xl transition-all">
        <div class="relative">
          <img [src]="user.photo ? user.photo : 'https://img.freepik.com/free-vector/illustration-businessman_53876-5856.jpg'" class="w-10 h-10 rounded-full object-cover border border-white/20">
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-400 border border-gray-950"></span>
        </div>
        <div class="flex flex-col min-w-0 flex-1">
          <span class="font-bold text-white text-xs truncate">{{ user.userName }}</span>
          <span class="text-[11px] text-indigo-300 font-medium truncate">{{ user.department }}</span>
        </div>
      </div>
    </ng-container>

    <ng-template #noContacts>
      <div class="p-6 text-center text-xs text-gray-400 glass-card">
        No contacts available for chat.
      </div>
    </ng-template>
  </div>
</div>
