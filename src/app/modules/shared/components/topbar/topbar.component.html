<div class="h-20 w-full flex items-center justify-between px-4 md:px-10 border-b border-white/10 glass-panel backdrop-blur-xl bg-gray-950/60 relative z-30 shadow-lg">
  <!-- Left Header Status & Mobile Hamburger Button -->
  <div class="flex items-center gap-3">
    <button (click)="toggleMobileSidebar()" class="md:hidden p-2 text-gray-300 hover:text-white rounded-xl bg-white/5 border border-white/10 flex items-center justify-center cursor-pointer">
      <mat-icon fontIcon="menu"></mat-icon>
    </button>
    <div class="flex items-center gap-2.5">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shadow-lg shadow-emerald-500/50"></div>
      <span class="text-xs font-semibold text-gray-300 tracking-wider uppercase hidden sm:inline">System Active</span>
    </div>
  </div>

  <!-- Right Profile Badge & Dropdown -->
  <div class="flex items-center gap-4">
    <div *ngIf="showPro" (click)="toggleMenu()" class="flex items-center gap-3 p-1.5 pr-4 rounded-full bg-white/[0.04] border border-white/10 hover:border-indigo-500/40 hover:bg-white/[0.08] cursor-pointer transition-all duration-300 shadow-md group">
      <div class="w-8 h-8 md:w-9 md:h-9 rounded-full overflow-hidden border border-indigo-500/50 shadow-inner">
        <img [src]="profile" alt="User Profile" class="w-full h-full object-cover">
      </div>
      <span class="text-xs font-semibold text-gray-200 hidden md:block group-hover:text-white transition-colors">{{name}}</span>
      <mat-icon fontIcon="arrow_drop_down" class="text-gray-400 group-hover:text-indigo-400 transition-colors"></mat-icon>
    </div>

    <!-- Dropdown Menu -->
    <div *ngIf="isMenuOpen" class="absolute right-4 md:right-6 top-[72px] w-60 rounded-2xl glass-panel bg-gray-900/95 border border-white/15 shadow-2xl p-2 z-50 animate-fade-in space-y-1">
      <div class="px-4 py-2.5 border-b border-white/10 mb-1">
        <p class="text-xs font-bold text-white">{{name}}</p>
        <p class="text-[10px] text-indigo-400 font-medium">Logged in</p>
      </div>

      <a routerLink="profile" (click)="isMenuOpen = false" class="menu-link">
        <mat-icon class="text-sm">person</mat-icon> Profile
      </a>
      <a routerLink="support" (click)="isMenuOpen = false" class="menu-link">
        <mat-icon class="text-sm">help_outline</mat-icon> Support
      </a>
      <a routerLink="about" (click)="isMenuOpen = false" class="menu-link">
        <mat-icon class="text-sm">info</mat-icon> About
      </a>

      <div class="border-t border-white/10 pt-1">
        <button (click)="onLogout()" class="menu-link text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 w-full">
          <mat-icon class="text-sm text-rose-400">exit_to_app</mat-icon> Logout
        </button>
      </div>
    </div>
  </div>
</div>
