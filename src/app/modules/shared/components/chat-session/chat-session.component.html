<div class="flex flex-row h-full min-h-[600px] w-full rounded-3xl overflow-hidden glass-panel border border-white/10 shadow-2xl animate-fade-in">
  <!-- Left Contacts Sidebar -->
  <app-chat-list class="w-full md:w-1/4 hidden md:block" (selectedContact)="selectedChat($event)"></app-chat-list>

  <!-- Right Chat Session Panel -->
  <div *ngIf="showChat" class="flex-1 flex flex-col justify-between p-4 md:p-6 bg-gray-950/40 relative">
    <!-- Header -->
    <div class="flex items-center justify-between pb-4 border-b border-white/10">
      <div class="flex items-center gap-3.5">
        <div class="relative">
          <img [src]="profileData.photo ? profileData.photo : 'https://img.freepik.com/free-vector/illustration-businessman_53876-5856.jpg'" class="w-11 h-11 rounded-full object-cover border border-indigo-500/40">
          <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-400 border-2 border-gray-950"></span>
        </div>
        <div>
          <h2 class="text-base font-extrabold text-white">{{ profileData.userName }}</h2>
          <p class="text-xs text-indigo-300 font-medium">{{ profileData.department }}</p>
        </div>
      </div>
    </div>

    <!-- Messages Window -->
    <div id="messages" class="flex-1 overflow-y-auto space-y-4 my-4 pr-2">
      <!-- Loading Indicator -->
      <div *ngIf="isLoadingMessages" class="flex items-center justify-center py-8 text-xs text-gray-400 gap-2">
        <div class="w-4 h-4 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></div>
        <span>Syncing Conversation...</span>
      </div>

      <!-- Messages Stream -->
      <div *ngFor="let message of previousMessage" class="flex flex-col">
        <!-- Sent Message (Own) -->
        <div *ngIf="isOwnMessage(message.sender)" class="flex justify-end items-end gap-2 my-1">
          <div class="glass-button px-4 py-2.5 rounded-2xl rounded-br-none text-xs text-white max-w-xs shadow-md">
            {{ message.content }}
          </div>
        </div>

        <!-- Received Message -->
        <div *ngIf="!isOwnMessage(message.sender)" class="flex justify-start items-end gap-2 my-1">
          <div class="glass-card px-4 py-2.5 rounded-2xl rounded-bl-none text-xs text-gray-200 max-w-xs border border-white/10">
            {{ message.content }}
          </div>
        </div>
      </div>
    </div>

    <!-- Message Input Bar -->
    <div class="pt-3 border-t border-white/10">
      <div class="relative flex items-center gap-2">
        <input 
          [(ngModel)]="inputMessage" 
          (input)="onTyping()" 
          (keyup.enter)="onMessageSent()" 
          type="text" 
          placeholder="Type your message..." 
          class="w-full glass-input text-xs pl-4 pr-24 py-3.5 rounded-2xl">
        <button (click)="onMessageSent()" class="absolute right-2 glass-button px-5 py-2 text-xs font-bold flex items-center gap-1">
          <span>Send</span>
          <mat-icon fontIcon="send" class="text-xs"></mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
