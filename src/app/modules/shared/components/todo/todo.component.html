<div class="min-h-screen p-4 md:p-8 space-y-6 animate-fade-in">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-white/10 pb-6">
    <div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">WorkSync Tasks &amp; Todo List</h1>
      <p class="text-xs md:text-sm text-gray-400 mt-1">Organize your daily tasks, set priorities, and track progress</p>
    </div>
  </div>

  <!-- Add Task Form Card -->
  <div class="glass-panel p-6 rounded-3xl border border-white/10 shadow-2xl">
    <form (ngSubmit)="addTask()" #todoForm="ngForm" class="grid grid-cols-1 md:grid-cols-12 gap-4">
      <div class="md:col-span-5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Task Title</label>
        <input type="text" name="title" class="w-full px-4 py-3 glass-input text-sm" placeholder="e.g. Review Q3 Sales Report" [(ngModel)]="newTask.title" required>
      </div>

      <div class="md:col-span-5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Description</label>
        <input type="text" name="description" class="w-full px-4 py-3 glass-input text-sm" placeholder="e.g. Prepare summary for management meeting" [(ngModel)]="newTask.description" required>
      </div>

      <div class="md:col-span-2 flex items-end">
        <button type="submit" [disabled]="!todoForm.valid" class="w-full py-3 px-6 glass-button text-sm font-bold flex items-center justify-center gap-2">
          <mat-icon fontIcon="add_task"></mat-icon>
          <span>Add Task</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Tasks List -->
  <div class="space-y-3">
    <h2 class="text-lg font-bold text-white tracking-wide mb-3 flex items-center gap-2">
      <mat-icon class="text-indigo-400" fontIcon="playlist_add_check"></mat-icon>
      <span>Your Tasks</span>
    </h2>

    <div class="flex flex-col-reverse gap-3">
      <div *ngFor="let task of tasks" class="glass-card glass-card-hover p-4 md:p-5 flex items-center justify-between border border-white/10 transition-all">
        <div class="flex items-center gap-4">
          <input type="checkbox" (change)="updateTaskStatus($event, task._id)" [checked]="task.status === 'done'" class="w-5 h-5 rounded accent-indigo-500 bg-gray-900 border-white/20 cursor-pointer">
          <div>
            <h3 class="font-bold text-sm transition-all" [class.line-through]="task.status === 'done'" [class.text-gray-400]="task.status === 'done'" [class.text-white]="task.status !== 'done'">
              {{ task.title }}
            </h3>
            <p class="text-xs text-gray-400 mt-0.5" [class.line-through]="task.status === 'done'">{{ task.description }}</p>
          </div>
        </div>

        <button (click)="deleteTask(task._id)" class="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 hover:border-rose-500/40 transition-all">
          <mat-icon class="text-sm">delete</mat-icon>
        </button>
      </div>

      <!-- Empty State -->
      <div *ngIf="tasks && tasks.length === 0" class="glass-card p-8 text-center text-gray-400 text-sm">
        <mat-icon class="text-4xl text-gray-500 mb-2">task</mat-icon>
        <p class="font-semibold">No Tasks Pending</p>
        <p class="text-xs text-gray-500 mt-1">Add a new task above to get started.</p>
      </div>
    </div>
  </div>
</div>
