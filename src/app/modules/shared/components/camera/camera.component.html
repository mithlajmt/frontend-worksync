<div *ngIf="cameraLoaded; else loadingScreen" class="glass-panel p-4 sm:p-6 rounded-3xl border border-white/10 w-full overflow-hidden text-center space-y-4 shadow-xl">
  <div class="text-xs font-semibold text-gray-300 flex items-center justify-between border-b border-white/10 pb-3">
    <span class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Camera Ready</span>
    </span>
    <span class="text-[10px] font-mono text-indigo-400 uppercase">{{ status }}</span>
  </div>

  <div *ngIf="stream" class="space-y-4">
    <div class="w-full rounded-2xl overflow-hidden border border-white/15 bg-black">
      <webcam [trigger]="$trigger" (imageCapture)="snapshot($event)" class="w-full h-auto block"></webcam>
    </div>
    
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
      <button class="glass-button w-full sm:w-auto px-5 py-2.5 text-xs font-bold" (click)="captureImage()">
        {{ btnLabel }}
      </button>
      <button class="px-5 py-2.5 rounded-xl bg-rose-500/20 border border-rose-500/30 text-rose-300 hover:bg-rose-500/30 text-xs font-bold w-full sm:w-auto" (click)="ofCam()">
        Turn Off Camera
      </button>
    </div>
  </div>

  <div *ngIf="previewImage" class="mt-4">
    <img [src]="previewImage" class="rounded-2xl border border-white/10 shadow-lg max-h-60 mx-auto object-cover">
  </div>

  <div *ngIf="showImage" class="mt-4 flex flex-row items-center justify-center gap-3">
    <button class="px-5 py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/30 text-amber-300 hover:bg-amber-500/30 text-xs font-bold" (click)="checkPermissions()">
      Retry
    </button>
    <button [disabled]="loading" class="glass-button px-6 py-2.5 text-xs font-bold" (click)="uploadImage()">
      {{ loading ? 'Submitting...' : 'Submit Verification' }}
    </button>
  </div>
</div>

<ng-template #loadingScreen>
  <div class="p-8 flex flex-col items-center justify-center space-y-3 glass-card rounded-3xl animate-pulse">
    <div class="w-10 h-10 rounded-full border-4 border-indigo-500/30 border-t-indigo-500 animate-spin"></div>
    <span class="text-xs text-gray-300 font-semibold">Initializing Camera Verification...</span>
  </div>
</ng-template>
