<div class="space-y-8 animate-fade-in" *ngIf="loaded; else loadingNotifications">
  <!-- Upcoming Active Events -->
  <div>
    <div class="flex items-center gap-3 mb-4">
      <div class="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></div>
      <h2 class="text-xl font-bold text-white tracking-wide">Upcoming Active Events</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <ng-container *ngIf="upcomingEvents.length > 0; else noUpcomingEvents">
        <div *ngFor="let event of upcomingEvents" class="glass-card glass-card-hover p-5 flex items-center justify-between border-l-4 border-l-amber-400">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
              <mat-icon fontIcon="event"></mat-icon>
            </div>
            <div>
              <h3 class="font-bold text-white text-base">{{event.title}}</h3>
              <p class="text-xs text-gray-400">Scheduled Event</p>
            </div>
          </div>
          <span class="glass-badge bg-amber-500/20 text-amber-300 border-amber-500/40">
            {{ event.start | date: 'dd MMM yy' }}
          </span>
        </div>
      </ng-container>
      <ng-template #noUpcomingEvents>
        <div class="col-span-full glass-card p-6 text-center text-gray-400 text-sm italic">
          No upcoming active events scheduled.
        </div>
      </ng-template>
    </div>
  </div>

  <!-- All Announced Events -->
  <div>
    <div class="flex items-center gap-3 mb-4">
      <div class="w-3 h-3 rounded-full bg-indigo-400"></div>
      <h2 class="text-xl font-bold text-white tracking-wide">All Announced Events</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let event of allEvents" class="glass-card glass-card-hover p-5 flex items-center justify-between">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
            <mat-icon fontIcon="notifications_active"></mat-icon>
          </div>
          <div>
            <h3 class="font-semibold text-gray-200 text-sm">{{event.title}}</h3>
            <span class="text-[11px] text-gray-400">Announcement</span>
          </div>
        </div>
        <span class="text-xs font-semibold text-indigo-300 bg-indigo-500/15 px-3 py-1.5 rounded-full border border-indigo-500/30">
          {{ event.start | date: 'dd MMM yy' }}
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Notification Skeleton Loading -->
<ng-template #loadingNotifications>
  <div class="space-y-6 animate-pulse p-2">
    <div class="h-6 w-48 bg-white/10 rounded-full"></div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let item of [1, 2, 3, 4]" class="glass-card p-5 h-20 flex items-center justify-between border border-white/5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-white/10"></div>
          <div class="space-y-2">
            <div class="h-3 w-32 bg-white/15 rounded-full"></div>
            <div class="h-2 w-20 bg-white/10 rounded-full"></div>
          </div>
        </div>
        <div class="h-6 w-16 bg-white/10 rounded-full"></div>
      </div>
    </div>
  </div>
</ng-template>
